<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานตรวจสอบงานดับไฟ | PEA พนัสนิคม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .pea-purple { background-color: #6b21a8; }
        .pea-yellow { background-color: #facc15; }
        .text-pea-purple { color: #6b21a8; }
        .bg-pea-gradient { background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="bg-pea-gradient h-56 w-full absolute top-0 left-0 z-0 rounded-b-[3rem] shadow-lg border-b-8 border-yellow-400"></div>

    <div class="relative z-10 max-w-md mx-auto px-5 pt-10 pb-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md">ระบบรายงานตรวจสอบงานดับไฟ</h1>
            <p class="text-yellow-300 font-semibold mt-1 tracking-widest uppercase text-sm">PEA (พนัสนิคม)</p>
        </div>

        <div class="glass-card rounded-[2.5rem] shadow-2xl p-8 border border-white/50">
            <form id="reportForm" class="space-y-6">
                
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2 ml-1">
                        <i class="fas fa-building text-purple-600"></i> ชื่อผู้ใช้ไฟฟ้า / ชื่อบริษัท
                    </label>
                    <input type="text" id="customerName" required
                        class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all text-gray-700"
                        placeholder="ระบุชื่อลูกค้ารายใหญ่">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2 ml-1">
                        <i class="fas fa-calendar-alt text-purple-600"></i> วันที่ไฟฟ้าดับ
                    </label>
                    <input type="date" id="outageDate" required
                        class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all text-gray-700">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2 ml-1">
                        <i class="fas fa-clipboard-check text-purple-600"></i> ผลการแจ้งหนังสือไฟฟ้าดับ
                    </label>
                    <div class="relative">
                        <select id="reportStatus" required
                            class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all text-gray-700 appearance-none cursor-pointer">
                            <option value="">เลือกผลการดำเนินการ...</option>
                            <option value="ส่งหนังสือเรียบร้อย">✅ ส่งหนังสือเรียบร้อย</option>
                            <option value="ลูกค้าเซ็นรับทราบแล้ว">✍️ ลูกค้าเซ็นรับทราบแล้ว</option>
                            <option value="มีปัญหา/ต้องแก้ไข">⚠️ มีปัญหา/ต้องแก้ไข</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="button" onclick="getLocation()" id="getLocationBtn"
                        class="w-full py-4 bg-slate-100 border-2 border-slate-200 text-slate-700 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-slate-200 transition-all active:scale-95 shadow-sm overflow-hidden group">
                        <div id="locIcon" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
                            <i class="fas fa-map-marker-alt text-red-500"></i>
                        </div>
                        <span id="locStatus">ระบุตำแหน่งหน้างานจริง</span>
                    </button>
                    <input type="hidden" id="lat"><input type="hidden" id="lng">
                </div>

                <div class="space-y-2">
                    <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
                    <label for="imageInput" id="imagePreview"
                        class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-purple-200 rounded-[2rem] bg-purple-50 hover:bg-purple-100 hover:border-purple-400 transition-all cursor-pointer relative group overflow-hidden shadow-inner">
                        <i class="fas fa-camera text-4xl text-purple-300 group-hover:text-purple-500 transition-colors mb-2"></i>
                        <p class="text-purple-400 text-xs font-bold uppercase">แตะเพื่อถ่ายรูปหน้างาน</p>
                    </label>
                </div>

                <button type="submit" 
                    class="w-full py-5 bg-purple-700 text-white text-lg font-black rounded-3xl shadow-xl shadow-purple-200 hover:bg-purple-800 active:scale-[0.98] transition-all transform flex items-center justify-center gap-3 group">
                    <span>ส่งรายงานข้อมูล</span>
                    <i class="fas fa-paper-plane group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-yellow-400 rounded-full shadow-sm border-2 border-white">
                <span class="text-[10px] font-black text-purple-900 tracking-tighter uppercase">(ผบร.)PEA Phanat Nikhom </span>
            </div>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 bg-purple-900/60 backdrop-blur-md hidden flex items-center justify-center z-50">
        <div class="bg-white px-10 py-8 rounded-[3rem] shadow-2xl text-center flex flex-col items-center">
            <div class="relative w-16 h-16 mb-4">
                <div class="absolute inset-0 border-4 border-purple-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-purple-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="font-bold text-lg text-gray-800">กำลังบันทึกข้อมูล...</p>
            <p class="text-gray-400 text-xs mt-1">ห้ามปิดหน้าจอนี้จนกว่าจะเสร็จ</p>
        </div>
    </div>

    <script>
        // *** สำคัญ: นำ URL ของ Web App จาก Apps Script มาใส่ตรงนี้ ***
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMVTLfKAIbtzPov37btldXJsIYKylTXcBIC_Iwks8QaqPfmZOwrIplKpRqy155qu3Lpg/exec"; 
        
        let base64Image = "";

        // ฟังก์ชันดึงพิกัด
        function getLocation() {
            const btn = document.getElementById('getLocationBtn');
            const statusText = document.getElementById('locStatus');
            const iconBox = document.getElementById('locIcon');
            
            if (navigator.geolocation) {
                statusText.innerText = "กำลังค้นหาสัญญาณ...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lng').value = pos.coords.longitude;
                    statusText.innerText = "บันทึกตำแหน่งสำเร็จ";
                    btn.classList.replace('bg-slate-100', 'bg-green-50');
                    btn.classList.replace('text-slate-700', 'text-green-700');
                    btn.classList.add('border-green-200');
                    iconBox.innerHTML = '<i class="fas fa-check text-green-600"></i>';
                }, (err) => {
                    alert("กรุณาอนุญาตให้แอปเข้าถึงตำแหน่ง (GPS)");
                    statusText.innerText = "ระบุตำแหน่งไม่สำเร็จ";
                }, { enableHighAccuracy: true });
            }
        }

        // ฟังก์ชันอ่านไฟล์รูปภาพ
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                base64Image = reader.result;
                const preview = document.getElementById('imagePreview');
                preview.style.backgroundImage = `url(${reader.result})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                preview.innerHTML = '<div class="absolute inset-0 bg-black/20 flex items-center justify-center"><span class="text-white text-xs font-bold bg-purple-600 px-4 py-2 rounded-full shadow-lg border border-white/20">เปลี่ยนรูปภาพ</span></div>'; 
                preview.classList.remove('border-dashed');
            };
            reader.readAsDataURL(file);
        });

        // ส่งข้อมูล
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!document.getElementById('lat').value) return alert("กรุณาระบุตำแหน่ง GPS ก่อนส่ง");
            if(!base64Image) return alert("กรุณาแนบรูปถ่ายหน้างานจริง");

            document.getElementById('loading').classList.remove('hidden');

            const payload = {
                customerName: document.getElementById('customerName').value,
                outageDate: document.getElementById('outageDate').value,
                reportStatus: document.getElementById('reportStatus').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                image: base64Image
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                
                alert("🚀 บันทึกข้อมูลสำเร็จ!");
                location.reload();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
                document.getElementById('loading').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
